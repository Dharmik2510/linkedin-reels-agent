<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Reelify — Saved → Reels</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: oklch(0.16 0.008 70);
      --bg-2: oklch(0.20 0.010 70);
      --bg-3: oklch(0.24 0.012 70);
      --line: oklch(0.30 0.012 70);
      --line-2: oklch(0.38 0.012 70);
      --fg: oklch(0.96 0.012 80);
      --fg-2: oklch(0.78 0.010 80);
      --fg-3: oklch(0.55 0.010 80);
      --accent: oklch(0.88 0.19 128);
      --accent-deep: oklch(0.55 0.16 130);
      --warn: oklch(0.82 0.15 70);
      --danger: oklch(0.70 0.18 25);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg); font-family: 'Inter', system-ui, sans-serif; font-feature-settings: 'cv11','ss01'; }
    body {
      min-height: 100vh;
      background:
        radial-gradient(1200px 700px at 70% -10%, oklch(0.24 0.04 130 / 0.18), transparent 60%),
        radial-gradient(900px 600px at -10% 110%, oklch(0.22 0.02 60 / 0.5), transparent 60%),
        var(--bg);
      overflow-x: hidden;
    }
    .mono { font-family: 'Geist Mono', ui-monospace, monospace; }
    .app { max-width: 1440px; margin: 0 auto; padding: 22px 28px 28px; }

    /* ---------- Header ---------- */
    header.top {
      display: flex; align-items: center; gap: 18px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--line);
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-mark {
      width: 34px; height: 34px; position: relative;
      border-radius: 8px;
      background: linear-gradient(140deg, var(--accent), var(--accent-deep));
      display: grid; place-items: center;
      box-shadow: 0 0 0 1px oklch(0.92 0.18 130 / 0.4), 0 6px 24px oklch(0.88 0.19 128 / 0.25);
    }
    .brand-mark::after {
      content: ""; position: absolute; inset: 0; border-radius: inherit;
      background: repeating-linear-gradient(90deg, transparent 0 3px, oklch(0 0 0 / 0.10) 3px 4px);
      mix-blend-mode: overlay; opacity: 0.6;
    }
    .brand-mark svg { width: 18px; height: 18px; color: oklch(0.18 0.02 130); position: relative; z-index: 1; }
    .brand-name { font-weight: 700; letter-spacing: -0.01em; font-size: 18px; }
    .brand-sub { color: var(--fg-3); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; font-family: 'Geist Mono', monospace; }

    .top-spacer { flex: 1; }
    .status-pill {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 6px 12px; border-radius: 999px;
      border: 1px solid var(--line-2);
      background: var(--bg-2);
      font-family: 'Geist Mono', monospace; font-size: 12px; color: var(--fg-2);
    }
    .status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--fg-3);
      box-shadow: 0 0 0 0 currentColor;
    }
    .status-dot.live { background: var(--accent); animation: ping 1.6s ease-out infinite; color: var(--accent); }
    .status-dot.warn { background: var(--warn); }
    @keyframes ping {
      0% { box-shadow: 0 0 0 0 currentColor; opacity: 1; }
      80% { box-shadow: 0 0 0 8px transparent; opacity: 0.6; }
      100% { box-shadow: 0 0 0 0 transparent; opacity: 1; }
    }

    .icon-btn {
      width: 34px; height: 34px; border-radius: 8px;
      border: 1px solid var(--line-2); background: var(--bg-2);
      display: grid; place-items: center; color: var(--fg-2);
      cursor: pointer;
    }
    .icon-btn:hover { color: var(--fg); border-color: var(--accent); }

    /* ---------- Grid ---------- */
    .grid {
      margin-top: 22px;
      display: grid;
      grid-template-columns: 320px 1fr 380px;
      gap: 18px;
      align-items: stretch;
    }
    @media (max-width: 1180px) {
      .grid { grid-template-columns: 1fr; }
    }

    .panel {
      background: linear-gradient(180deg, var(--bg-2), oklch(0.18 0.008 70));
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 18px;
      position: relative;
    }
    .panel-title {
      display: flex; align-items: center; justify-content: space-between;
      font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--fg-3);
      margin-bottom: 14px;
    }
    .panel-title .num {
      width: 18px; height: 18px; border-radius: 4px;
      display: grid; place-items: center;
      background: var(--bg-3); color: var(--fg-2);
      font-size: 10px;
    }

    /* ---------- Config panel ---------- */
    .config-row { margin-bottom: 16px; }
    .config-label { font-size: 12px; color: var(--fg-3); margin-bottom: 6px; font-family: 'Geist Mono', monospace; }
    .config-source {
      display: flex; align-items: center; gap: 10px;
      padding: 12px; background: var(--bg-3); border: 1px solid var(--line-2);
      border-radius: 10px;
    }
    .source-ico {
      width: 32px; height: 32px; border-radius: 8px;
      background: oklch(0.30 0.015 70); display: grid; place-items: center; color: var(--accent);
      border: 1px solid var(--line-2);
    }
    .source-name { font-weight: 600; font-size: 14px; }
    .source-meta { font-size: 11px; color: var(--fg-3); font-family: 'Geist Mono', monospace; }

    /* Custom dropdown */
    .dd {
      position: relative;
    }
    .dd-trigger {
      width: 100%;
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 14px; border-radius: 10px;
      background: var(--bg-3); border: 1px solid var(--line-2);
      color: var(--fg); font-size: 14px; cursor: pointer;
      font-family: 'Inter', sans-serif;
    }
    .dd-trigger:hover { border-color: var(--line-2); }
    .dd-trigger .chev { transition: transform 0.18s ease; color: var(--fg-3); }
    .dd.open .dd-trigger .chev { transform: rotate(180deg); }
    .dd-value { display: flex; align-items: baseline; gap: 8px; }
    .dd-value .v { font-family: 'Geist Mono', monospace; font-weight: 600; font-size: 16px; }
    .dd-value .u { color: var(--fg-3); font-size: 12px; font-family: 'Geist Mono', monospace; }
    .dd-menu {
      position: absolute; top: calc(100% + 6px); left: 0; right: 0;
      background: oklch(0.22 0.010 70);
      border: 1px solid var(--line-2);
      border-radius: 10px;
      padding: 6px;
      box-shadow: 0 16px 40px oklch(0 0 0 / 0.5);
      z-index: 20;
      max-height: 240px; overflow: auto;
      display: none;
    }
    .dd.open .dd-menu { display: block; }
    .dd-opt {
      padding: 8px 10px; border-radius: 6px;
      display: flex; align-items: center; justify-content: space-between;
      font-family: 'Geist Mono', monospace; font-size: 13px;
      cursor: pointer; color: var(--fg-2);
    }
    .dd-opt:hover { background: var(--bg-3); color: var(--fg); }
    .dd-opt.sel { color: var(--accent); }
    .dd-opt .est { font-size: 11px; color: var(--fg-3); }

    .tone-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .tone-chip {
      padding: 8px 10px; border-radius: 8px;
      background: var(--bg-3); border: 1px solid var(--line-2);
      font-size: 12px; font-family: 'Geist Mono', monospace; color: var(--fg-2);
      cursor: pointer; text-align: center;
      transition: all 0.12s ease;
    }
    .tone-chip:hover { color: var(--fg); }
    .tone-chip.sel {
      background: oklch(0.30 0.04 130 / 0.35);
      border-color: var(--accent);
      color: var(--accent);
    }

    .run-btn {
      width: 100%; margin-top: 6px;
      padding: 14px; border-radius: 10px;
      background: var(--accent); color: oklch(0.18 0.03 130);
      font-weight: 700; font-size: 14px; letter-spacing: 0.02em;
      border: 0; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      box-shadow: 0 0 0 0 var(--accent);
      transition: box-shadow 0.2s ease, transform 0.06s ease;
      position: relative; overflow: hidden;
    }
    .run-btn:hover { box-shadow: 0 0 0 4px oklch(0.88 0.19 128 / 0.18); }
    .run-btn:active { transform: translateY(1px); }
    .run-btn[disabled] {
      background: var(--bg-3); color: var(--fg-3); cursor: not-allowed;
      box-shadow: none;
    }
    .run-btn .spin {
      width: 14px; height: 14px; border-radius: 50%;
      border: 2px solid currentColor; border-right-color: transparent;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .quota {
      margin-top: 14px; padding-top: 14px;
      border-top: 1px dashed var(--line-2);
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
    }
    .quota-cell .k { font-family: 'Geist Mono', monospace; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--fg-3); }
    .quota-cell .v { font-family: 'Geist Mono', monospace; font-size: 18px; font-weight: 600; color: var(--fg); margin-top: 2px; }
    .quota-bar { margin-top: 6px; height: 4px; background: var(--bg-3); border-radius: 2px; overflow: hidden; }
    .quota-bar > i { display: block; height: 100%; background: var(--accent); }

    /* ---------- Pipeline center panel ---------- */
    .pipe {
      min-height: 540px;
      padding: 0;
      overflow: hidden;
    }
    .pipe-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 20px; border-bottom: 1px solid var(--line);
    }
    .pipe-title {
      font-family: 'Geist Mono', monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--fg-3);
      display: flex; align-items: center; gap: 10px;
    }
    .stage-track {
      display: flex; align-items: center; gap: 8px;
      font-family: 'Geist Mono', monospace; font-size: 11px;
    }
    .stage-dot { display: flex; align-items: center; gap: 6px; color: var(--fg-3); }
    .stage-dot i {
      width: 6px; height: 6px; border-radius: 50%; background: var(--line-2);
    }
    .stage-dot.active { color: var(--fg); }
    .stage-dot.active i { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
    .stage-dot.done { color: var(--fg-2); }
    .stage-dot.done i { background: var(--accent-deep); }

    .stage-sep { width: 14px; height: 1px; background: var(--line-2); }

    .pipe-body {
      position: relative;
      height: 460px;
      display: grid;
      grid-template-columns: 1fr 280px 1fr;
      align-items: center;
    }

    /* posts column (left) */
    .pipe-col {
      position: relative; height: 100%;
      padding: 24px 18px;
      display: flex; flex-direction: column; justify-content: center; gap: 10px;
      overflow: hidden;
    }
    .pipe-col.right { align-items: flex-end; }

    .col-label {
      position: absolute; top: 14px; font-family: 'Geist Mono', monospace; font-size: 10px;
      letter-spacing: 0.16em; text-transform: uppercase; color: var(--fg-3);
    }
    .pipe-col.left .col-label { left: 18px; }
    .pipe-col.right .col-label { right: 18px; }

    .post-card {
      width: 100%; max-width: 280px;
      background: var(--bg-3);
      border: 1px solid var(--line-2);
      border-radius: 10px;
      padding: 10px 12px;
      display: flex; gap: 10px;
      transform: translateX(0);
      transition: opacity 0.4s ease, transform 0.6s cubic-bezier(.7,0,.3,1);
      will-change: transform, opacity;
    }
    .post-card.staged { opacity: 0.35; }
    .post-card.flying {
      transform: translateX(80%); opacity: 0;
    }
    .post-card .av {
      width: 28px; height: 28px; border-radius: 50%;
      flex-shrink: 0;
      background: linear-gradient(135deg, oklch(0.55 0.10 var(--h, 60)), oklch(0.40 0.06 var(--h, 60)));
      border: 1px solid var(--line-2);
    }
    .post-card .meta { font-size: 11px; color: var(--fg-3); font-family: 'Geist Mono', monospace; }
    .post-card .body { font-size: 12px; color: var(--fg-2); line-height: 1.35; margin-top: 2px; }
    .post-card .body b { color: var(--fg); font-weight: 600; }

    /* Reel card on right */
    .reel-card {
      width: 100%; max-width: 220px;
      background: var(--bg-3);
      border: 1px solid var(--line-2);
      border-radius: 12px;
      padding: 10px;
      display: flex; align-items: center; gap: 10px;
      opacity: 0; transform: translateX(-30%);
      transition: opacity 0.5s ease, transform 0.6s cubic-bezier(.4,0,.2,1);
    }
    .reel-card.in { opacity: 1; transform: translateX(0); }
    .reel-thumb {
      width: 40px; height: 56px; border-radius: 6px; flex-shrink: 0;
      background:
        linear-gradient(160deg, oklch(0.50 0.15 var(--h, 130)), oklch(0.30 0.08 var(--h, 130)));
      position: relative; overflow: hidden;
      border: 1px solid oklch(0 0 0 / 0.3);
    }
    .reel-thumb::after {
      content: ""; position: absolute; inset: 0;
      background: repeating-linear-gradient(180deg, transparent 0 4px, oklch(0 0 0 / 0.10) 4px 5px);
    }
    .reel-thumb .play {
      position: absolute; inset: 0; display: grid; place-items: center; color: oklch(1 0 0 / 0.85);
    }
    .reel-title { font-size: 12px; font-weight: 600; color: var(--fg); line-height: 1.3; }
    .reel-meta { font-size: 10px; color: var(--fg-3); font-family: 'Geist Mono', monospace; margin-top: 4px; display: flex; gap: 8px; }
    .reel-meta b { color: var(--accent); font-weight: 500; }

    /* Center transform core */
    .core-wrap {
      position: relative; height: 100%;
      display: grid; place-items: center;
    }
    .core {
      position: relative;
      width: 240px; height: 240px;
    }
    .ring {
      position: absolute; inset: 0; border-radius: 50%;
      border: 1px solid var(--line-2);
    }
    .ring.r1 { inset: 20px; border-color: oklch(0.35 0.015 70); }
    .ring.r2 { inset: 50px; border-style: dashed; }
    .ring.r3 { inset: 80px; }
    .ring.spin1 { animation: rot 18s linear infinite; }
    .ring.spin2 { animation: rot 14s linear infinite reverse; }
    .ring.spin3 { animation: rot 10s linear infinite; }
    .ring .tick {
      position: absolute; width: 2px; height: 8px; background: var(--accent);
      top: -4px; left: 50%; transform: translateX(-50%); border-radius: 2px;
      box-shadow: 0 0 6px var(--accent);
    }
    .ring .tick.t2 { top: auto; bottom: -4px; background: var(--fg-2); box-shadow: none; }
    .ring .tick.t3 { top: 50%; left: -4px; transform: translateY(-50%); width: 8px; height: 2px; background: var(--fg-3); box-shadow: none; }
    .ring .tick.t4 { top: 50%; right: -4px; left: auto; transform: translateY(-50%); width: 8px; height: 2px; background: var(--fg-3); box-shadow: none; }
    @keyframes rot { to { transform: rotate(360deg); } }

    .core-center {
      position: absolute; inset: 0; display: grid; place-items: center;
    }
    .core-bulb {
      width: 110px; height: 110px; border-radius: 50%;
      background:
        radial-gradient(circle at 30% 30%, oklch(0.92 0.18 130 / 0.7), transparent 55%),
        radial-gradient(circle at 70% 70%, oklch(0.55 0.16 130 / 0.5), transparent 60%),
        oklch(0.22 0.02 130);
      border: 1px solid oklch(0.55 0.16 130 / 0.4);
      box-shadow:
        0 0 60px oklch(0.88 0.19 128 / 0.25),
        inset 0 0 30px oklch(0 0 0 / 0.4);
      position: relative;
      display: grid; place-items: center;
    }
    .core-bulb::before {
      content: ""; position: absolute; inset: -10px; border-radius: 50%;
      border: 1px solid oklch(0.88 0.19 128 / 0.25);
      animation: pulse-ring 3s ease-out infinite;
    }
    @keyframes pulse-ring {
      0% { transform: scale(0.7); opacity: 0.9; }
      100% { transform: scale(1.4); opacity: 0; }
    }
    .core-bulb .glyph {
      font-family: 'Geist Mono', monospace;
      font-size: 11px; font-weight: 600;
      color: var(--accent);
      text-align: center; line-height: 1.3;
      letter-spacing: 0.08em;
      text-shadow: 0 0 10px oklch(0.88 0.19 128 / 0.6);
    }
    .core-bulb .glyph b { display: block; font-size: 22px; color: var(--fg); letter-spacing: 0; }

    /* connector svg */
    .connector {
      position: absolute; inset: 0; pointer-events: none;
      width: 100%; height: 100%;
    }
    .connector path {
      fill: none; stroke: oklch(0.35 0.02 70);
      stroke-width: 1.2; stroke-dasharray: 4 4;
    }
    .connector path.live {
      stroke: var(--accent);
      stroke-dasharray: 6 8;
      stroke-width: 1.6;
      animation: dash 1.4s linear infinite;
      filter: drop-shadow(0 0 4px oklch(0.88 0.19 128 / 0.5));
    }
    @keyframes dash {
      to { stroke-dashoffset: -28; }
    }
    .particle {
      fill: var(--accent); filter: drop-shadow(0 0 4px var(--accent));
    }

    /* Stats below pipe */
    .pipe-stats {
      display: grid; grid-template-columns: repeat(4, 1fr);
      border-top: 1px solid var(--line);
    }
    .stat {
      padding: 14px 18px;
      border-right: 1px solid var(--line);
    }
    .stat:last-child { border-right: 0; }
    .stat .k { font-family: 'Geist Mono', monospace; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--fg-3); }
    .stat .v {
      font-family: 'Geist Mono', monospace; font-size: 22px; font-weight: 600; color: var(--fg);
      margin-top: 4px; display: flex; align-items: baseline; gap: 6px;
    }
    .stat .v small { font-size: 11px; color: var(--fg-3); font-weight: 400; }
    .stat .delta { font-size: 11px; color: var(--accent); font-family: 'Geist Mono', monospace; }

    /* ---------- Right column (results + log) ---------- */
    .right-col { display: flex; flex-direction: column; gap: 18px; }
    .results { flex: 1; display: flex; flex-direction: column; min-height: 0; }
    .results-list {
      margin-top: 6px;
      display: flex; flex-direction: column; gap: 10px;
      max-height: 360px; overflow: auto;
      padding-right: 4px;
    }
    .results-list::-webkit-scrollbar { width: 6px; }
    .results-list::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 3px; }

    .script-card {
      background: var(--bg-3);
      border: 1px solid var(--line-2);
      border-radius: 10px;
      padding: 12px;
      opacity: 0; transform: translateY(8px);
      animation: slideIn 0.45s cubic-bezier(.4,0,.2,1) forwards;
      position: relative;
    }
    @keyframes slideIn {
      to { opacity: 1; transform: translateY(0); }
    }
    .script-card .row1 {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 8px;
    }
    .script-card .idx {
      width: 22px; height: 22px; border-radius: 6px;
      background: oklch(0.30 0.04 130 / 0.5);
      color: var(--accent); font-family: 'Geist Mono', monospace; font-size: 11px;
      display: grid; place-items: center; font-weight: 600;
    }
    .script-card .title { font-size: 13px; font-weight: 600; flex: 1; line-height: 1.3; }
    .script-card .dur {
      font-family: 'Geist Mono', monospace; font-size: 10px;
      padding: 2px 6px; border-radius: 4px; background: var(--bg);
      color: var(--fg-2); border: 1px solid var(--line-2);
    }
    .script-card .hook {
      font-size: 11px; color: var(--fg-2); font-style: italic;
      padding: 8px 10px;
      border-left: 2px solid var(--accent);
      background: oklch(0.20 0.01 70);
      border-radius: 0 6px 6px 0;
      line-height: 1.4;
    }
    .script-card .tags {
      display: flex; gap: 4px; margin-top: 8px; flex-wrap: wrap;
    }
    .script-card .tag {
      font-family: 'Geist Mono', monospace; font-size: 10px;
      color: var(--fg-3); padding: 2px 6px;
      border: 1px solid var(--line-2); border-radius: 4px;
    }
    .script-card .scenes {
      display: flex; gap: 2px; margin-top: 8px;
    }
    .scene-bar {
      flex: 1; height: 3px; background: var(--bg);
      border-radius: 2px; overflow: hidden;
    }
    .scene-bar i { display: block; height: 100%; background: var(--accent-deep); }
    .scene-bar.hl i { background: var(--accent); }

    /* Empty state */
    .empty-state {
      padding: 30px 16px; text-align: center;
      color: var(--fg-3); font-size: 13px;
    }
    .empty-state .big {
      font-family: 'Geist Mono', monospace; font-size: 11px;
      letter-spacing: 0.16em; text-transform: uppercase;
      color: var(--fg-2); margin-bottom: 6px;
    }

    /* Terminal */
    .terminal {
      height: 200px;
      display: flex; flex-direction: column;
      padding: 0;
      overflow: hidden;
    }
    .terminal-head {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--line);
      font-family: 'Geist Mono', monospace; font-size: 10px;
      letter-spacing: 0.14em; text-transform: uppercase; color: var(--fg-3);
    }
    .term-dots { display: flex; gap: 4px; margin-right: 8px; }
    .term-dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--line-2); }
    .term-dots i:nth-child(1) { background: oklch(0.65 0.18 25); }
    .term-dots i:nth-child(2) { background: oklch(0.78 0.14 80); }
    .term-dots i:nth-child(3) { background: oklch(0.70 0.15 145); }
    .terminal-body {
      flex: 1; overflow: auto;
      padding: 10px 14px;
      font-family: 'Geist Mono', monospace; font-size: 11px;
      line-height: 1.55;
      color: var(--fg-2);
    }
    .terminal-body::-webkit-scrollbar { width: 6px; }
    .terminal-body::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 3px; }
    .log-line { display: flex; gap: 10px; opacity: 0; animation: logIn 0.2s ease forwards; }
    @keyframes logIn { to { opacity: 1; } }
    .log-line .t { color: var(--fg-3); flex-shrink: 0; }
    .log-line .tag {
      flex-shrink: 0; width: 60px;
      color: var(--fg-3);
    }
    .log-line.info .tag { color: oklch(0.75 0.10 230); }
    .log-line.ok .tag { color: var(--accent); }
    .log-line.warn .tag { color: oklch(0.82 0.15 70); }
    .log-line .msg { color: var(--fg); }
    .log-line .msg em { color: var(--fg-3); font-style: normal; }
    .cursor {
      display: inline-block; width: 7px; height: 12px;
      background: var(--accent); vertical-align: -2px;
      animation: blink 1s steps(2) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    /* faint grid background on pipe */
    .pipe-body::before {
      content: ""; position: absolute; inset: 0;
      background-image:
        linear-gradient(oklch(0.30 0.012 70) 1px, transparent 1px),
        linear-gradient(90deg, oklch(0.30 0.012 70) 1px, transparent 1px);
      background-size: 32px 32px;
      mask-image: radial-gradient(circle at center, black 30%, transparent 75%);
      opacity: 0.25;
      pointer-events: none;
    }
  </style>
</head>

  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
